name: CI

# Automated verification gate for the security & test spine.
# Red blocks merge. Runs on every push and PR to the audit/main branches.

on:
  push:
    branches: [review/full-audit, main]
  pull_request:
    branches: [review/full-audit, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Local Supabase stack for RLS / integration tests. The Supabase CLI is
      # available on GitHub-hosted runners via the official action.
      - name: Start Supabase (local)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Boot database + apply migrations + seed
        run: |
          supabase start
          supabase db reset

      - name: Link seed users to auth
        run: node scripts/link-auth-users.mjs

      - name: Verify (typecheck + lint + test + build)
        run: npm run verify
        env:
          # Non-production, local-only values for the CI run.
          APP_ENV: test
